# 🚫 DEPRECATED: Jekyll is not compatible with Vite projects.
# Use .github/workflows/vite-gh-pages.yml (the correct deployment workflow).
name: Deprecated Jekyll (not compatible)
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [redeploy]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
